name: 0011 Baberu Smoke

on:
  push:
    branches:
      - refactor/0011-region-first-baberu-audit
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run Baberu first-run download and inference smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .smoke/baberu | Out-Null
          $env:LMT_BABERU_MODEL_ROOT = (Resolve-Path .smoke/baberu).Path
          $env:LMT_BABERU_SMOKE = "1"
          dotnet run --project tests/PipelineChecks/PipelineChecks.csproj -c Release
