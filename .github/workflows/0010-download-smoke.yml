name: 0010 RT-DETR Download Smoke

on:
  push:
    branches:
      - fix/0010-rtdetr-download-lock
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run first-run detector download smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .smoke | Out-Null
          $modelPath = Join-Path (Resolve-Path .smoke).Path "detector-v4-s_int8.onnx"
          $env:LMT_RTDETR_MODEL_PATH = $modelPath
          $env:LMT_RTDETR_DOWNLOAD_SMOKE = "1"
          dotnet run --project tests/PipelineChecks/PipelineChecks.csproj -c Release
